services:
  - type: web
    name: suart-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8001
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  - type: web
    env: static
    name: suart-frontend
    buildCommand: cd react-interface && npm install && npm run build
    staticPublishPath: ./react-interface/dist
    envVars:
      - key: VITE_API_URL
        value: https://suart-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
